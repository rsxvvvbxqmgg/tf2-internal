<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#14100e"/>
  
  <!-- Industrial grid background -->
  <path d="M 20 20 L 236 20 M 20 236 L 236 236 M 20 20 L 20 236 M 236 20 L 236 236" stroke="#d8cfc4" stroke-width="1" opacity="0.15"/>
  <path d="M 68 20 L 68 236 M 116 20 L 116 236 M 164 20 L 164 236 M 212 20 L 212 236" stroke="#d8cfc4" stroke-width="0.5" opacity="0.08"/>
  <path d="M 20 68 L 236 68 M 20 116 L 236 116 M 20 164 L 236 164 M 20 212 L 236 212" stroke="#d8cfc4" stroke-width="0.5" opacity="0.08"/>

  <!-- Cracked team-colored badge (tilted, off-center) -->
  <g transform="translate(128,128) rotate(-8)">
    <!-- Badge base shape -->
    <path d="M -70 -60 L -20 -75 L 40 -70 L 72 -40 L 78 20 L 55 65 L 10 80 L -45 72 L -75 35 L -78 -15 Z" fill="#b7410e" stroke="#14100e" stroke-width="3"/>
    <!-- Inner badge inset -->
    <path d="M -60 -50 L -18 -62 L 32 -58 L 60 -32 L 65 16 L 46 54 L 8 66 L -38 60 L -63 28 L -66 -12 Z" fill="#14100e" stroke="#d8cfc4" stroke-width="1.5"/>
    <!-- Crack lines through badge -->
    <path d="M -30 -60 L -10 -20 L 5 5 L -15 30 L 5 60 L 20 72" stroke="#d8cfc4" stroke-width="2.5" fill="none"/>
    <path d="M -50 -45 L -25 -30 L -15 -20 M 5 5 L 25 -10 L 50 -25" stroke="#d8cfc4" stroke-width="2" fill="none"/>
    <path d="M -15 30 L -35 40 L -55 45 M 5 60 L 25 55 L 45 48" stroke="#d8cfc4" stroke-width="1.5" fill="none"/>
    <!-- Stencil marks on badge -->
    <path d="M -40 -40 L -35 -35 M 35 -45 L 40 -40 M 50 30 L 45 35" stroke="#ff6b1a" stroke-width="2"/>
  </g>

  <!-- Crossed wrench and syringe -->
  <g transform="translate(128,128)">
    <!-- Wrench (diagonal from lower-left to upper-right) -->
    <g transform="rotate(-45)">
      <!-- Wrench handle -->
      <rect x="-8" y="-85" width="16" height="110" fill="#d8cfc4"/>
      <rect x="-8" y="-85" width="16" height="110" fill="none" stroke="#14100e" stroke-width="1.5"/>
      <!-- Wrench head -->
      <path d="M -22 -105 L 22 -105 L 22 -85 L 12 -85 L 12 -95 L -12 -95 L -12 -85 L -22 -85 Z" fill="#d8cfc4" stroke="#14100e" stroke-width="1.5"/>
      <rect x="-20" y="-100" width="40" height="6" fill="#b7410e"/>
      <!-- Wrench tail -->
      <path d="M -14 25 L 14 25 L 14 40 L 10 45 L -10 45 L -14 40 Z" fill="#d8cfc4" stroke="#14100e" stroke-width="1.5"/>
    </g>

    <!-- Syringe (diagonal from lower-right to upper-left, overlapping wrench) -->
    <g transform="rotate(45)">
      <!-- Syringe barrel -->
      <rect x="-10" y="-50" width="20" height="70" rx="2" fill="#d8cfc4" stroke="#14100e" stroke-width="1.5"/>
      <!-- Plunger -->
      <rect x="-6" y="-70" width="12" height="22" fill="#ff6b1a" stroke="#14100e" stroke-width="1"/>
      <rect x="-14" y="-72" width="28" height="6" fill="#d8cfc4" stroke="#14100e" stroke-width="1"/>
      <!-- Measurement lines -->
      <path d="M -10 -40 L -3 -40 M -10 -30 L -3 -30 M -10 -20 L -3 -20 M -10 -10 L -3 -10" stroke="#14100e" stroke-width="1.5"/>
      <path d="M 3 -40 L 10 -40 M 3 -30 L 10 -30 M 3 -20 L 10 -20 M 3 -10 L 10 -10" stroke="#14100e" stroke-width="1.5"/>
      <!-- Needle -->
      <line x1="0" y1="20" x2="0" y2="55" stroke="#d8cfc4" stroke-width="3"/>
      <line x1="0" y1="55" x2="0" y2="68" stroke="#d8cfc4" stroke-width="1.5"/>
      <!-- Liquid -->
      <rect x="-8" y="-5" width="16" height="25" fill="#b7410e" opacity="0.8"/>
      <path d="M -8 -5 L 8 -5" stroke="#ff6b1a" stroke-width="2"/>
    </g>

    <!-- Overlap intersection marker -->
    <circle cx="0" cy="0" r="8" fill="#ff6b1a" stroke="#14100e" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#14100e"/>
  </g>

  <!-- Additional industrial detail -->
  <g transform="translate(128,128)">
    <!-- Corner brackets -->
    <path d="M -100 -100 L -100 -85 M -100 -100 L -85 -100" stroke="#ff6b1a" stroke-width="2.5" fill="none"/>
    <path d="M 100 -100 L 100 -85 M 100 -100 L 85 -100" stroke="#ff6b1a" stroke-width="2.5" fill="none"/>
    <path d="M -100 100 L -100 85 M -100 100 L -85 100" stroke="#ff6b1a" stroke-width="2.5" fill="none"/>
    <path d="M 100 100 L 100 85 M 100 100 L 85 100" stroke="#ff6b1a" stroke-width="2.5" fill="none"/>
    
    <!-- Small tick marks -->
    <path d="M -90 -50 L -85 -50 M -90 50 L -85 50 M 85 -50 L 90 -50 M 85 50 L 90 50" stroke="#d8cfc4" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Wordmark small -->
  <text x="128" y="244" text-anchor="middle" font-family="monospace" font-size="10" fill="#d8cfc4" letter-spacing="4" opacity="0.7">TF2-INTERNAL</text>
</svg>
